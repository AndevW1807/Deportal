spring:
  application:
    name: deportal
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  web:
    error:
      include-stacktrace: never
      include-message: never
jwt:
  secret: ${JWT_SECRET}
  issuer: deportal
  expiration-seconds: 3600
