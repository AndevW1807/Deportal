<article class="card" [class.leaving]="leaving()">
  <header class="top">
    <span class="badge" [style.background]="look().tint" [style.color]="look().ink">
      <mat-icon aria-hidden="true">{{ look().icon }}</mat-icon>
    </span>
    <p class="sport">{{ court().sportType.name }}</p>
  </header>

  <h2>{{ court().name }}</h2>

  <div class="schedule">
    <div class="track" aria-hidden="true">
      <span class="open" [style.left]="span().left" [style.width]="span().width"></span>
    </div>
    <div class="scale">
      <span>06:00</span>
      <span>{{ court().opensAt }} – {{ court().closesAt }}</span>
      <span>22:00</span>
    </div>
  </div>

  <div class="facts">
    <p class="people">
      <mat-icon aria-hidden="true">group</mat-icon>
      {{ people() }}
    </p>
    <p class="rate">{{ rate() }}</p>
  </div>

  <div class="actions">
    <button type="button" (click)="edit.emit(court())" [attr.aria-label]="'Editar ' + court().name">
      <mat-icon aria-hidden="true">edit</mat-icon>
      Editar
    </button>
    <button
      type="button"
      class="danger"
      (click)="remove.emit(court())"
      [attr.aria-label]="'Eliminar ' + court().name"
    >
      <mat-icon aria-hidden="true">delete</mat-icon>
      Eliminar
    </button>
  </div>
</article>
