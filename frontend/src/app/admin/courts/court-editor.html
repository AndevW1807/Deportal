<form (submit)="onSubmit($event)" novalidate>
  <header>
    <h2 id="court-editor-title">Editar cancha</h2>
    <button type="button" class="close" (click)="cancel()" aria-label="Cerrar">
      <span aria-hidden="true">×</span>
    </button>
  </header>

  <label>
    Nombre
    <input type="text" [formField]="editorForm.name" aria-label="Nombre" />
    @if (nameTaken()) {
      <span class="error">Ya existe una cancha con ese nombre</span>
    } @else if (message(editorForm.name()); as text) {
      <span class="error">{{ text }}</span>
    }
  </label>

  <label>
    Deporte
    <select [formField]="editorForm.sportTypeCode" aria-label="Deporte">
      @for (sport of data.sportTypes; track sport.code) {
        <option [value]="sport.code">{{ sport.name }}</option>
      }
    </select>
    @if (message(editorForm.sportTypeCode()); as text) {
      <span class="error">{{ text }}</span>
    }
  </label>

  <label>
    Capacidad
    <input type="number" [formField]="editorForm.capacity" aria-label="Capacidad" />
    @if (message(editorForm.capacity()); as text) {
      <span class="error">{{ text }}</span>
    }
  </label>

  <div class="times">
    <label>
      Apertura
      <input type="time" [formField]="editorForm.opensAt" aria-label="Apertura" />
    </label>
    <label>
      Cierre
      <input type="time" [formField]="editorForm.closesAt" aria-label="Cierre" />
    </label>
  </div>
  @if (hoursMessage(); as text) {
    <span class="error">{{ text }}</span>
  }

  <label>
    Tarifa por hora
    <input type="number" [formField]="editorForm.hourlyRate" aria-label="Tarifa por hora" />
    @if (message(editorForm.hourlyRate()); as text) {
      <span class="error">{{ text }}</span>
    }
  </label>

  <div class="actions">
    <button type="button" class="ghost" (click)="cancel()">Cancelar</button>
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</form>
