<app-auth-layout>
  <form novalidate aria-labelledby="login-title" (submit)="onSubmit($event)">
    <h1 id="login-title">Inicia sesión</h1>
    <p class="subtitle">Ingresa a tu cuenta para continuar</p>

    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="3"
          y="5.5"
          width="18"
          height="13"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        />
        <path
          d="M4 7l8 6 8-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Correo electrónico"
        aria-label="Correo electrónico"
        [formField]="loginForm.email"
        [attr.aria-invalid]="message(loginForm.email()) ? true : null"
        [attr.aria-describedby]="message(loginForm.email()) ? 'email-error' : null"
      />
    </div>
    @if (message(loginForm.email()); as error) {
      <p class="error" id="email-error" role="alert">{{ error }}</p>
    }

    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect
          x="5"
          y="10"
          width="14"
          height="10"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        />
        <path
          d="M8 10V7.5a4 4 0 0 1 8 0V10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
      <input
        id="password"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="current-password"
        placeholder="Contraseña"
        aria-label="Contraseña"
        [formField]="loginForm.password"
        [attr.aria-invalid]="message(loginForm.password()) ? true : null"
        [attr.aria-describedby]="message(loginForm.password()) ? 'password-error' : null"
      />
      <button
        class="reveal"
        type="button"
        [attr.aria-pressed]="passwordVisible()"
        [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        (click)="passwordVisible.set(!passwordVisible())"
      >
        @if (passwordVisible()) {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 3l18 18M10.6 6.2A10 10 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.7M6.2 6.2C3.7 7.9 2 12 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
            <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
          </svg>
        }
      </button>
    </div>
    @if (message(loginForm.password()); as error) {
      <p class="error" id="password-error" role="alert">{{ error }}</p>
    }

    <div class="row">
      <button class="forgot" type="button">¿Olvidaste tu contraseña?</button>
    </div>

    @if (failure(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <button
      class="submit"
      type="submit"
      [disabled]="loginForm().submitting()"
      [attr.aria-busy]="loginForm().submitting() ? true : null"
    >
      Iniciar sesión <span aria-hidden="true">→</span>
    </button>

    <p class="switch">¿No tienes una cuenta? <a routerLink="/register">Crear cuenta</a></p>
  </form>
</app-auth-layout>
