<section class="page">
  <h1>Reservar cancha</h1>
  <p class="help">Elige la cancha, el horario y confirma. La membresía se toma de tu cuenta.</p>

  <ol class="steps">
    @for (label of steps; track label; let index = $index) {
      <li [class.done]="index < step()">
        <button
          type="button"
          [attr.aria-current]="step() === index ? 'step' : null"
          [disabled]="index > step()"
          (click)="goTo(index)"
        >
          <span>{{ index + 1 }}</span>
          {{ label }}
        </button>
      </li>
    }
  </ol>

  @if (step() === 0) {
    <app-reserve-court-step
      [courts]="courts()"
      [visibleCourts]="visibleCourts()"
      [query]="query()"
      [sport]="sport()"
      [sports]="sports()"
      [selectedId]="courtId()"
      (queryChange)="query.set($event)"
      (sportChange)="sport.set($event)"
      (filtersCleared)="clearFilters()"
      (courtChosen)="chooseCourt($event)"
      (continued)="continueFromCourt()"
    />
  }

  @if (step() === 1 && court(); as selected) {
    <div class="schedule">
      <app-reserve-date-step
        [monthLabel]="monthLabel()"
        [canGoBack]="canGoBack()"
        [days]="days()"
        [date]="date()"
        [today]="today"
        (previousMonth)="previousMonth()"
        (nextMonth)="nextMonth()"
        (dateChosen)="chooseDate($event)"
      />
      <app-reserve-hours-step
        [duration]="duration()"
        [sameDayWait]="sameDayWait()"
        [slots]="slots()"
        [start]="start()"
        (durationChange)="changeDuration($event)"
        (startChosen)="chooseStart($event)"
      />
    </div>

    <div class="actions">
      <button type="button" class="text" (click)="back()">Atrás</button>
      <button type="button" class="primary" [disabled]="start() === null" (click)="continueFromSchedule()">
        Continuar
      </button>
    </div>
  }

  @if (step() === 2 && court(); as selected) {
    <app-reserve-summary
      [court]="selected"
      [date]="date()"
      [start]="start()"
      [duration]="duration()"
      [price]="quote()"
      [busy]="busy()"
      (back)="back()"
      (reserved)="reserve()"
    />
  }
</section>
