<header class="bar">
  <a class="brand" routerLink="/">
    <img ngSrc="/assets/brand/logo.webp" width="1024" height="341" alt="Deportal" priority />
  </a>
  @if (showHomeLink()) {
    <a class="home-icon" routerLink="/" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 11.2 12 4.5l8 6.7V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
      </svg>
    </a>
  }
  <div class="actions">
    @if (showHomeLink()) {
      <a class="home" routerLink="/">Inicio</a>
    }
    <a routerLink="/login" routerLinkActive ariaCurrentWhenActive="page">Iniciar sesión</a>
    <a class="register" routerLink="/register" routerLinkActive ariaCurrentWhenActive="page"
      >Registrarse</a
    >
  </div>
</header>
