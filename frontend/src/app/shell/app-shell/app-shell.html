<mat-sidenav-container class="shell">
  <mat-sidenav
    id="admin-menu"
    [mode]="isNarrow() ? 'over' : 'side'"
    [opened]="opened()"
    (openedChange)="opened.set($event)"
  >
    <div class="drawer">
    <div class="sidenav-head">
      @if (isNarrow()) {
        <p class="profile">
          <span class="avatar" aria-hidden="true">
            <mat-icon>person</mat-icon>
          </span>
          @if (profileName(); as name) {
            <span>{{ name }}</span>
          }
        </p>
        <button
          matIconButton
          type="button"
          aria-label="Cerrar menú"
          (click)="toggleMenu()"
        >
          <mat-icon>close</mat-icon>
        </button>
      } @else {
        <a class="brand" [routerLink]="homeLink()">
          <img ngSrc="/assets/brand/logo.webp" width="1024" height="341" alt="Deportal" priority />
        </a>
      }
    </div>
    <mat-nav-list aria-label="Menú">
      @for (item of menu(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive
          #itemLink="routerLinkActive"
          [activated]="itemLink.isActive"
          ariaCurrentWhenActive="page"
          (click)="closeIfNarrow()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <mat-nav-list class="session">
      <button mat-list-item type="button" class="logout" (click)="signOut()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Cerrar sesión</span>
      </button>
    </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="workspace">
    <mat-toolbar>
      @if (isNarrow()) {
        <button
          matIconButton
          type="button"
          aria-controls="admin-menu"
          [attr.aria-expanded]="opened()"
          aria-label="Abrir menú"
          (click)="toggleMenu()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <a class="brand header-logo" [routerLink]="homeLink()">
          <img ngSrc="/assets/brand/logo.webp" width="1024" height="341" alt="Deportal" />
        </a>
      } @else {
        @if (pageTitle()) {
          <p class="page-title">{{ pageTitle() }}</p>
        }
        <p class="profile">
          <span class="avatar" aria-hidden="true">
            <mat-icon>person</mat-icon>
          </span>
          @if (profileName(); as name) {
            <span>{{ name }}</span>
          }
        </p>
      }
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
